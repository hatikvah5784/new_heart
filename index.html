<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>有聲書目錄</title>
<style>
  :root { --bg:#faf8f5; --fg:#222; --muted:#777; --accent:#8a5a2b; --line:#e6e1da; --hover:#f1ece5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a19; --fg:#eee; --muted:#999; --accent:#d9a066; --line:#333; --hover:#26241f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); line-height:1.5;
         font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 150px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  ol { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  li { display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  li:hover, li.playing { background:var(--hover); }
  li.playing .t { color:var(--accent); font-weight:600; }
  .n { width:2em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .info { flex:1; min-width:0; }
  .ch, .meta { font-size:.8rem; color:var(--muted); }
  .meta { white-space:nowrap; }
  .dl { color:var(--muted); text-decoration:none; padding:4px 6px; font-size:1.1rem; }
  .dl:hover { color:var(--accent); }
  .player { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:10px 16px 14px; }
  .wrap { max-width:720px; margin:0 auto; }
  .now { font-size:.9rem; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctrls { display:flex; gap:8px; align-items:center; }
  audio { flex:1; min-width:0; }
  button, select { font:inherit; background:none; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>有聲書</h1>
  <p class="sub">共 14 章 · 點選章節播放,播完自動接下一章</p>
  <ol id="list"></ol>
</main>

<div class="player">
  <div class="wrap">
    <div class="now" id="now">尚未播放</div>
    <div class="ctrls">
      <button id="prev" title="上一章">⏮</button>
      <audio id="audio" controls preload="none"></audio>
      <button id="next" title="下一章">⏭</button>
      <select id="rate" title="播放速度">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>
</div>

<script>
const files = [
  ["01_第一章_你從來就不是老闆.mp3", 16968362],
  ["02_第二章_科學正在追趕卻跨不過那條界線.mp3", 21321121],
  ["03_第三章_充不了電的手機.mp3", 20422384],
  ["04_第四章_掙扎證明你是活的.mp3", 20992901],
  ["05_第五章_認識你的內在藍圖_身體魂靈.mp3", 19850318],
  ["06_第六章_被劫持的指揮中心_心思意志情感.mp3", 23669008],
  ["07_第七章_改寫那些你沒有選擇的劇本.mp3", 21937083],
  ["08_第八章_不效法這破碎的世界.mp3", 22277502],
  ["09_第九章_把肉體釘在十字架上.mp3", 29005495],
  ["10_第十章_攻破心智的堅固營壘.mp3", 28135304],
  ["11_第十一章_趕出霸佔者.mp3", 26709009],
  ["12_第十二章_心思意志情感_把順序擺對.mp3", 22929841],
  ["13_第十三章_安息揭露能力_希伯來書第四章的節奏.mp3", 26212508],
  ["14_第十四章_每日的衣裝.mp3", 25588670],
];

const $ = id => document.getElementById(id);
const audio = $("audio"), list = $("list"), rate = $("rate");
const KEY = "audiobook-progress";
let cur = -1, lastSave = 0;

const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
};

function parse(f) {
  const p = f.replace(/\.mp3$/i, "").split("_");
  return { num: +p[0], ch: p[1], title: p.slice(2).join(":") };
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

files.forEach(([f, bytes], i) => {
  const { num, ch, title } = parse(f);
  const li = document.createElement("li");
  li.innerHTML = `
    <span class="n">${num}</span>
    <div class="info"><div class="ch">${ch}</div><div class="t">${title}</div></div>
    <span class="meta">${(bytes / 1048576).toFixed(1)} MB</span>
    <a class="dl" href="${encodeURIComponent(f)}" download title="下載">⤓</a>`;
  li.addEventListener("click", e => { if (!e.target.closest(".dl")) play(i); });
  list.appendChild(li);
});

function load(i, startAt = 0) {
  cur = i;
  const { ch, title } = parse(files[i][0]);
  audio.src = encodeURIComponent(files[i][0]);
  audio.defaultPlaybackRate = audio.playbackRate = +rate.value;
  if (startAt) audio.addEventListener("loadedmetadata", () => { audio.currentTime = startAt; }, { once: true });
  [...list.children].forEach((li, j) => li.classList.toggle("playing", j === i));
  $("now").textContent = `${ch}:${title}`;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist: ch });
  }
}

function play(i) {
  if (i < 0 || i >= files.length) return;
  if (i === cur && audio.src) { audio.paused ? audio.play() : audio.pause(); return; }
  load(i);
  audio.play();
}

$("prev").onclick = () => play(cur - 1);
$("next").onclick = () => play(cur + 1);
rate.onchange = () => { audio.defaultPlaybackRate = audio.playbackRate = +rate.value; };

audio.addEventListener("timeupdate", () => {
  if (Date.now() - lastSave > 3000) { lastSave = Date.now(); store.set({ i: cur, t: audio.currentTime }); }
});
audio.addEventListener("ended", () => {
  if (cur + 1 < files.length) play(cur + 1);
  else store.set({ i: cur, t: 0 });
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("previoustrack", () => play(cur - 1));
  navigator.mediaSession.setActionHandler("nexttrack", () => play(cur + 1));
}

// Resume where you left off
const saved = store.get();
if (saved && files[saved.i]) {
  load(saved.i, saved.t);
  if (saved.t > 5) $("now").textContent += ` — 上次聽到 ${fmt(saved.t)}`;
}
</script>
</body>
</html>
